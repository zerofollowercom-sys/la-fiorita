<!doctype html>
<html lang="it">
<head>

<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20rx%3D%2240%22%20fill%3D%22%23FAF7F2%22%2F%3E%3Cg%20stroke%3D%22%23111%22%20stroke-width%3D%226%22%3E%3Ccircle%20cx%3D%2290%22%20cy%3D%2250%22%20r%3D%2222%22%20fill%3D%22%23F2547D%22%2F%3E%3Ccircle%20cx%3D%22125%22%20cy%3D%2270%22%20r%3D%2222%22%20fill%3D%22%23F2547D%22%2F%3E%3Ccircle%20cx%3D%22125%22%20cy%3D%22110%22%20r%3D%2222%22%20fill%3D%22%23F2547D%22%2F%3E%3Ccircle%20cx%3D%2290%22%20cy%3D%22130%22%20r%3D%2222%22%20fill%3D%22%23F2547D%22%2F%3E%3Ccircle%20cx%3D%2255%22%20cy%3D%22110%22%20r%3D%2222%22%20fill%3D%22%23F2547D%22%2F%3E%3Ccircle%20cx%3D%2255%22%20cy%3D%2270%22%20r%3D%2222%22%20fill%3D%22%23F2547D%22%2F%3E%3Ccircle%20cx%3D%2290%22%20cy%3D%2290%22%20r%3D%2226%22%20fill%3D%22%23F5C842%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E%0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F2;--ink:#111;--rosa:#F2547D;--verde:#7BC043;--giallo:#F5C842;--viola:#6C4BE0;--azzurro:#4FB3E8;--arancio:#F58A3C;--grigio:#B8B8B8;--bianco:#fff;--r:14px;--bw:3px;--sh:4px 4px 0 var(--ink);--font:'Space Grotesk',-apple-system,system-ui,sans-serif;--tabh:clamp(76px,9.4vh,108px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(17px,min(2.1vh,4.6vw),24px)} /* cresce con l'altezza dello schermo, ma non oltre quanto consente la larghezza */
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.3 var(--font);-webkit-text-size-adjust:100%}
body{background:var(--bg)}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 16px)}
h1{font-size:1.882rem;line-height:1.05;margin:4px 0 2px;font-weight:700}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.brand{min-width:0}.logo[hidden]{display:none}.logo{display:block;width:clamp(120px,16vh,160px);height:auto;max-width:70%;margin:2px 0 4px} /* larghezza fissa e altezza automatica: mai deformato */.head .btn-sq{margin-top:2px}
.fam{display:flex;flex-direction:column;gap:8px;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:10px}.fam-top{display:flex;align-items:center;gap:10px}.fam-top .name{flex:1;min-width:0;font-weight:700;font-size:1.059rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fam-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.fam-ctl .num{font-size:1.647rem;font-weight:700;min-width:44px;text-align:center}.fam-ctl .lbl{color:#555;font-size:0.824rem}.fam-ctl .rm{margin-left:auto}
.day{margin-top:14px}.day h3{margin:0 0 8px}.svc{display:flex;flex-direction:column;gap:6px;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:10px 12px;cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}.svc .top{display:flex;align-items:center;gap:10px}.svc .top .grow{flex:1;min-width:0}.svc .fams{color:#333;font-size:0.882rem;line-height:1.45}.svc .fams b{white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;padding:6px 4px}.tot .big{font-size:1.765rem}
h2{font-size:1.294rem;margin:0;font-weight:700}
h3{font-size:0.882rem;margin:clamp(18px,2.4vh,30px) 0 8px;text-transform:uppercase;letter-spacing:.04em}
.sub{color:#555;margin:0 0 14px}
.card{background:var(--bianco);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.btn{font:700 1rem var(--font);color:var(--ink);background:var(--bianco);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);min-height:clamp(52px,6.4vh,76px);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:transform .05s,box-shadow .05s}
.btn:active,.tab:active,.dish:active,.chip:active,.folder:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.45;box-shadow:var(--sh);transform:none}
.btn-block{width:100%;font-size:1.176rem;min-height:clamp(60px,7.4vh,88px)}
.btn-sq{width:clamp(52px,6.4vh,76px);padding:0;font-size:1.412rem;flex:0 0 auto}
.btn-big{min-height:clamp(64px,7.8vh,92px);font-size:2rem;width:clamp(64px,7.8vh,92px);padding:0}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row>.fix{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr;gap:clamp(12px,1.6vh,20px)}
.chip{font:700 0.882rem var(--font);color:var(--ink);background:var(--bianco);border:var(--bw) solid var(--ink);border-radius:999px;padding:8px 14px;min-height:clamp(44px,5.4vh,64px);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.seg{display:flex;border:var(--bw) solid var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);background:#fff}
.seg button{flex:1;font:700 1rem var(--font);background:#fff;border:0;min-height:clamp(52px,6.4vh,76px);cursor:pointer;color:var(--ink)}
.seg button+button{border-left:var(--bw) solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.ico{display:inline-flex;align-items:center;justify-content:center;width:clamp(48px,5.9vh,70px);height:clamp(48px,5.9vh,70px);border:var(--bw) solid var(--ink);border-radius:12px;font-size:1.529rem;flex:0 0 auto;background:#fff;font-weight:700}
.ico.sm{width:clamp(36px,4.4vh,52px);height:clamp(36px,4.4vh,52px);font-size:1.176rem;border-radius:9px;border-width:2px}
.dish{display:flex;align-items:center;gap:10px;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:10px;min-height:clamp(68px,8.4vh,100px);font:700 1rem var(--font);cursor:pointer;text-align:left;color:var(--ink)}
.dish.on{outline:var(--bw) solid var(--ink);outline-offset:2px}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=tel]{font:500 1rem var(--font);color:var(--ink);background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);min-height:clamp(52px,6.4vh,76px);padding:0 14px;width:100%;box-shadow:var(--sh);-webkit-appearance:none;appearance:none}
input[type=date]{min-width:0}
.counter{display:flex;align-items:center;gap:12px;justify-content:center}
.counter .num{font-size:2.588rem;font-weight:700;min-width:70px;text-align:center}
.list{display:flex;flex-direction:column;gap:clamp(10px,1.3vh,16px)}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:10px 12px;min-height:clamp(60px,7.4vh,88px);cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}
.item .grow{flex:1;min-width:0}.item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .meta{color:#555;font-size:0.824rem}
.item .n{font-size:1.294rem;font-weight:700}
.folder{position:relative;margin-top:16px;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-top:14px;cursor:pointer;min-height:120px;text-align:left;font:inherit;color:var(--ink)}
.folder::before{content:"";position:absolute;left:-3px;top:-14px;width:45%;height:22px;border:var(--bw) solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;background:var(--tab,#B8B8B8)}
.folder .name{font-weight:700;font-size:1.059rem;margin-top:10px}.folder .meta{color:#555;font-size:0.824rem}
.stat{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px}
.stat .lbl{font-size:0.824rem;color:#555;font-weight:700;text-transform:uppercase}.stat .val{font-size:2.353rem;font-weight:700;line-height:1.1}
.stat.bg-giallo .lbl,.stat.bg-rosa .lbl{color:var(--ink)}
.bar{height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;margin-top:6px}.bar>i{display:block;height:100%}
.banner{border:var(--bw) solid var(--ink);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-weight:700}
.banner a{color:var(--ink)}
.banner-rosso{background:#ffb3c1}.banner-giallo{background:var(--giallo)}
.empty{text-align:center;padding:30px 10px;color:#555}.empty .big{font-size:2.824rem}
#tabbar[hidden]{display:none}
#tabbar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:var(--bw) solid var(--ink);z-index:5}
.tab{flex:1;font:700 0.706rem var(--font);color:var(--ink);background:#fff;border:var(--bw) solid var(--ink);border-radius:12px;min-height:clamp(56px,6.9vh,80px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);padding:0}
.tab-ico{font-size:1.294rem}
.tab.on.tab-rosa{background:var(--rosa)}.tab.on.tab-arancio{background:var(--arancio)}.tab.on.tab-viola{background:var(--viola);color:#fff}.tab.on.tab-giallo{background:var(--giallo)}.tab.on.tab-verde{background:var(--verde)}.tab.on.tab-azzurro{background:var(--azzurro)}
#sheet-backdrop{position:fixed;inset:0;background:rgba(17,17,17,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet-backdrop[hidden]{display:none}
#sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--bg);border:var(--bw) solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:12px 20px;border-radius:999px;z-index:30;border:var(--bw) solid #fff;box-shadow:var(--sh);max-width:calc(100% - 32px);text-align:center}
.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:0.824rem;margin-bottom:6px;text-transform:uppercase}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.emoji-grid button{font-size:1.529rem;min-height:48px;background:#fff;border:2px solid var(--ink);border-radius:10px;cursor:pointer}.emoji-grid button.on{background:var(--giallo);box-shadow:3px 3px 0 var(--ink)}
.color-row{display:flex;gap:10px}.color-row button{flex:1;min-height:44px;border:var(--bw) solid var(--ink);border-radius:10px;cursor:pointer}.color-row button.on{outline:var(--bw) solid var(--ink);outline-offset:2px}
.danger{border-color:#b00020;color:#b00020}
.mt{margin-top:clamp(12px,1.6vh,20px)}.mb{margin-bottom:12px}.center{text-align:center}.muted{color:#555;font-size:0.824rem}
/* colori di sfondo: in fondo così vincono su .ico/.dish/.stat/.btn */
.bg-rosa{background:var(--rosa)}.bg-verde{background:var(--verde)}.bg-giallo{background:var(--giallo)}.bg-viola{background:var(--viola);color:#fff}.bg-azzurro{background:var(--azzurro)}.bg-arancio{background:var(--arancio)}.bg-grigio{background:var(--grigio)}

/* una colonna sola su tutti gli schermi (scelta di Lorenzo); i contenitori .cols e .storico-grid restano semplici blocchi */
.cols,.storico-grid{display:block}

</style>
</head>
<body>
<div id="app">
  <div id="storage-warning" class="banner banner-rosso" hidden>⚠️ Memoria del telefono non disponibile: i dati non verranno salvati.</div>
  <main id="screens">
    <section id="tab-tavolo" class="screen"></section>
    <section id="tab-storico" class="screen" hidden></section>
    <section id="tab-rendiconto" class="screen" hidden></section>
    <section id="tab-gruppi" class="screen" hidden></section>
    <section id="tab-portate" class="screen" hidden></section>
    <section id="tab-impostazioni" class="screen" hidden></section>
  </main>
  <nav id="tabbar">
    <button data-tab="tavolo" class="tab tab-rosa"><span class="tab-ico">✏️</span>Tavolo</button>
    <button data-tab="storico" class="tab tab-arancio"><span class="tab-ico">📅</span>Storico</button>
    <button data-tab="rendiconto" class="tab tab-verde"><span class="tab-ico">📊</span>Conti</button>
    <button data-tab="gruppi" class="tab tab-viola"><span class="tab-ico">👨‍👩‍👧</span>Ospiti</button>
    <button data-tab="portate" class="tab tab-giallo"><span class="tab-ico">🍽️</span>Menu</button>
  </nav>
</div>
<div id="sheet-backdrop" hidden><div id="sheet" role="dialog"><div id="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" class="btn btn-sq" aria-label="Chiudi">✕</button></div><div id="sheet-body"></div></div></div>
<div id="toast" hidden></div>
<script>
// La Fiorita 2.0 — funzioni pure (nessun DOM). UMD: browser → window.LaFioritaLogic, Node → module.exports
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LaFioritaLogic = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
  const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const pad = n => String(n).padStart(2, '0');

  // ---- date ----
  function todayISO(d) { d = d || new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function parseISO(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
  function isValidISO(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number); const dt = new Date(y, m - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
  }
  function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return todayISO(d); }
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
  function monthRange(y, m) { return { from: `${y}-${pad(m)}-01`, to: `${y}-${pad(m)}-${pad(daysInMonth(y, m))}` }; }
  function yearRange(y) { return { from: `${y}-01-01`, to: `${y}-12-31` }; }
  function fortnightRange(y, m, half) {
    return half === 1 ? { from: `${y}-${pad(m)}-01`, to: `${y}-${pad(m)}-15` }
                      : { from: `${y}-${pad(m)}-16`, to: `${y}-${pad(m)}-${pad(daysInMonth(y, m))}` };
  }
  function formatDateIt(iso) { const d = parseISO(iso); return `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`; }
  function monthLabelIt(y, m) { const n = MESI[m - 1]; return `${n[0].toUpperCase()}${n.slice(1)} ${y}`; }
  function defaultMeal(hour) { return hour < 16 ? 'pranzo' : 'cena'; }

  // ---- servizi (un tavolo = data + pasto + menu + famiglie) ----
  function entryPeople(e) { return (e.guests || []).reduce((s, g) => s + (Number(g.people) || 0), 0); }
  function findService(entries, date, meal) { return entries.find(e => e.date === date && e.meal === meal) || null; }
  function filterEntries(entries, f) {
    f = f || {};
    return entries.filter(e =>
      (!f.from || e.date >= f.from) && (!f.to || e.date <= f.to) &&
      (!f.guestId || (e.guests || []).some(g => g.guestId === f.guestId)) && (!f.meal || e.meal === f.meal));
  }
  function sortEntries(entries) {
    const mealOrder = { pranzo: 0, cena: 1 };
    return entries.slice().sort((a, b) => b.date.localeCompare(a.date) || mealOrder[a.meal] - mealOrder[b.meal]);
  }
  function groupByDay(entries) {
    const map = new Map();
    for (const e of sortEntries(entries)) { if (!map.has(e.date)) map.set(e.date, []); map.get(e.date).push(e); }
    return Array.from(map, ([date, list]) => ({ date, entries: list }));
  }
  // opts.guestId: conta solo le persone di quella famiglia (filtro "per famiglia" dei Conti)
  function summarize(entries, ctx, opts) {
    opts = opts || {};
    const gById = new Map(ctx.guests.map(g => [g.id, g]));
    const dById = new Map(ctx.dishes.map(d => [d.id, d]));
    const s = { tables: 0, people: 0, byMeal: { pranzo: { tables: 0, people: 0 }, cena: { tables: 0, people: 0 } }, byDish: [], byGuest: [] };
    const dish = new Map(), guest = new Map();
    for (const e of entries) {
      const rows = (e.guests || []).filter(g => !opts.guestId || g.guestId === opts.guestId);
      const p = rows.reduce((t, g) => t + (Number(g.people) || 0), 0);
      s.tables++; s.people += p;
      const m = s.byMeal[e.meal] || (s.byMeal[e.meal] = { tables: 0, people: 0 }); m.tables++; m.people += p;
      if (!dish.has(e.dishId)) {
        const d = dById.get(e.dishId);
        dish.set(e.dishId, { id: e.dishId, name: d ? d.name : (e.dishId == null ? 'Senza menu' : 'Menu eliminato'), emoji: d ? d.emoji : '❔', color: d ? d.color : 'grigio', hidden: d ? !!d.hidden : true, order: d ? d.order : 999, tables: 0, people: 0 });
      }
      const dd = dish.get(e.dishId); dd.tables++; dd.people += p;
      for (const row of rows) {
        if (!guest.has(row.guestId)) {
          const g = gById.get(row.guestId);
          guest.set(row.guestId, { id: row.guestId, name: g ? g.name : 'Ospite eliminato', archived: g ? !!g.archived : true, tables: 0, people: 0 });
        }
        const gg = guest.get(row.guestId); gg.tables++; gg.people += Number(row.people) || 0;
      }
    }
    s.byDish = Array.from(dish.values()).sort((a, b) => b.people - a.people || b.tables - a.tables || a.order - b.order);
    s.byGuest = Array.from(guest.values()).sort((a, b) => b.people - a.people || b.tables - a.tables || a.name.localeCompare(b.name));
    return s;
  }
  function guestStats(entries) {
    const out = {};
    for (const e of entries) for (const row of (e.guests || [])) {
      const o = out[row.guestId] || (out[row.guestId] = { tables: 0, people: 0, lastDate: null });
      o.tables++; o.people += Number(row.people) || 0;
      if (!o.lastDate || e.date > o.lastDate) o.lastDate = e.date;
    }
    return out;
  }

  // ---- costanti ----
  const PEOPLE_MAX = 99;
  const COLORS = ['rosa', 'verde', 'giallo', 'viola', 'azzurro', 'arancio'];
  const EMOJI_CIBO = ['🍕','🥩','🍝','🐟','🍗','🥗','🍔','🌭','🍟','🍤','🦐','🦑','🐙','🥓','🍖','🌮','🌯','🥪','🍞','🧀','🥚','🍳','🥘','🍲','🍛','🍜','🍣','🍱','🥟','🍚','🍰','🎂','🍨','🍦','🍩','🍪','🍷','🍺','☕','🥂'];

  // ---- id, nomi, validazione ----
  function newId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function normalizeName(s) { return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
  function nameExists(list, name, excludeId) {
    const n = normalizeName(name);
    return list.some(x => x.id !== excludeId && normalizeName(x.name) === n);
  }

        <div class="field"><label>Codice</label><input type="tel" inputmode="numeric" id="lock-pin" autocomplete="off" placeholder="····" style="text-align:center;font-size:1.8rem;letter-spacing:.3em"></div>
        <button class="btn btn-block bg-verde" id="lock-go">Entra</button><p class="muted center mt">Lo chiede solo la prima volta su questo telefono.</p></section>`;
      const go = () => {
        const v = main.querySelector('#lock-pin').value.trim();
        if (hashPin(v) === ACCESS_HASH) { App.unlock(); App.mount(); }
        else { App.toast('Codice sbagliato'); main.querySelector('#lock-pin').value = ''; main.querySelector('#lock-pin').focus(); }
      };
      main.querySelector('#lock-go').onclick = go;
      main.querySelector('#lock-pin').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      main.querySelector('#lock-pin').focus();
    },
    esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
    iconBox(emoji, color, cls) { return `<span class="ico bg-${color || 'grigio'} ${cls || ''}">${App.esc(emoji)}</span>`; },
    guestName(id) { const g = store.state.guests.find(x => x.id === id); return g ? g.name : 'Ospite eliminato'; },
    dish(id) { return store.state.dishes.find(x => x.id === id) || { name: id == null ? 'Senza menu' : 'Menu eliminato', emoji: '❔', color: 'grigio' }; },
    mealLabel(m) { return m === 'pranzo' ? '☀️ Pranzo' : '🌙 Cena'; },

    },

    // ---- bozza del tavolo ----
    currentService() { return L.findService(store.state.entries, App.ui.date, App.ui.meal); },
    loadForm() {
      const svc = App.currentService();
      App.ui.dishId = svc ? svc.dishId : null;
      App.ui.guests = svc ? svc.guests.map(g => ({ guestId: g.guestId, people: g.people })) : [];
    },
    formDirty() {
      const svc = App.currentService(); const u = App.ui;
      if (!svc) return !!u.dishId || u.guests.length > 0;
      return svc.dishId !== u.dishId || JSON.stringify(svc.guests) !== JSON.stringify(u.guests);
    },
    // Scrive la bozza nel tavolo del giorno/pasto. Torna gli errori (vuoto = salvato)
    saveForm() {
      const u = App.ui;
      const entry = { date: u.date, meal: u.meal, dishId: u.dishId, guests: u.guests.map(g => ({ guestId: g.guestId, people: g.people })) };
      const errs = L.validateEntry(entry, store.state); if (errs.length) return errs;
      const existing = App.currentService();
      if (existing) Object.assign(existing, { dishId: entry.dishId, guests: entry.guests, updatedAt: Date.now() });
      else store.state.entries.push(Object.assign({ id: L.newId(), createdAt: Date.now(), updatedAt: Date.now() }, entry));
      store.save(); App.refreshBanners();
      return [];
    },
    // Apre il tavolo di un giorno e pasto (da Storico o Conti); dopo Salva si torna a data e pasto di prima
    openService(date, meal) {
      const u = App.ui;
      if (!u.returnTo && (date !== u.date || meal !== u.meal)) u.returnTo = { date: u.date, meal: u.meal };
      u.date = date; u.meal = meal; App.loadForm(); App.go('tavolo');
    },
    afterForm() {
      const u = App.ui;
      if (u.returnTo) { u.date = u.returnTo.date; u.meal = u.returnTo.meal; u.returnTo = null; }
      App.loadForm();
    },
    // L'app in Home resta congelata per giorni: alla ripresa, se non c'è niente da salvare e la data era "oggi", passa al nuovo oggi
    refreshDay(nowDate) {
      const u = App.ui, t = L.todayISO(nowDate);
      if (!App.formDirty() && u.date === App.lastToday && t !== App.lastToday) { u.date = t; u.meal = L.defaultMeal(nowDate.getHours()); u.returnTo = null; App.loadForm(); }
      App.lastToday = t; App.render();
    },
    refreshBanners() {
      const el = document.getElementById('storage-warning');
      let msg = '';
      if (!store.storageOk) msg = '⚠️ Memoria del telefono non disponibile: i dati non verranno salvati.';
      else if (store.loadError) msg = '⚠️ I dati salvati erano illeggibili: si riparte da zero. Una copia grezza è conservata nella memoria del telefono (chiave lafiorita.v2.broken).';
      else if (store.loadSkipped > 0) msg = `⚠️ ${store.loadSkipped} righe salvate non erano valide e sono state scartate.`;
      el.textContent = msg; el.hidden = !msg;
    },

    start() {
      store.load(); App.loadForm();
      App.refreshBanners();
      document.addEventListener('visibilitychange', () => { if (!document.hidden) App.refreshDay(new Date()); });
      window.addEventListener('pageshow', () => App.refreshDay(new Date()));
      document.getElementById('tabbar').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) App.go(b.dataset.tab); });
      document.addEventListener('click', e => { const a = e.target.closest('[data-go]'); if (a) { e.preventDefault(); App.go(a.dataset.go); } });
      document.getElementById('sheet-close').addEventListener('click', App.closeSheet);
      document.getElementById('sheet-backdrop').addEventListener('click', e => { if (e.target.id === 'sheet-backdrop') App.closeSheet(); });
      App.screensHtml = document.getElementById('screens').innerHTML;
      if (App.checkAccess()) App.mount(); else App.renderLock();
    },
    mount() {
      document.getElementById('screens').innerHTML = App.screensHtml;
      document.getElementById('tabbar').hidden = false;
      App.render();
    },
    go(tab) { App.ui.tab = tab; App.render(); window.scrollTo(0, 0); },
    render() {
      if (!App.unlocked) return;
      document.querySelectorAll('#tabbar .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === App.ui.tab));
      document.querySelectorAll('.screen').forEach(s => { s.hidden = s.id !== 'tab-' + App.ui.tab; });
      const scr = App.screens[App.ui.tab]; const root = document.getElementById('tab-' + App.ui.tab);
      if (scr) scr.render(root);
    },
    save() { const ok = store.save(); App.refreshBanners(); App.render(); return ok; },
    toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 1800); },
    sheet({ title, html, onMount }) {
      document.getElementById('sheet-title').textContent = title || '';
      const body = document.getElementById('sheet-body'); body.innerHTML = html;
      document.getElementById('sheet-backdrop').hidden = false; document.body.style.overflow = 'hidden';
      document.getElementById('sheet').scrollTop = 0;
      if (onMount) onMount(body);
    },
    closeSheet() {
      document.getElementById('sheet-backdrop').hidden = true; document.body.style.overflow = '';
      if (App._confirmPending) { const r = App._confirmPending; App._confirmPending = null; r(false); } // chiusa con ✕ o toccando fuori = No
    },
    // Conferma dentro l'app (window.confirm è bloccato nel riquadro di claude.ai): foglio con Sì / No
    _confirmPending: null,
    confirm(msg) {
      return new Promise(resolve => {
        const done = v => { App._confirmPending = null; App.closeSheet(); resolve(v); };
        App.sheet({
          title: 'Conferma',
          html: `<p style="font-size:1.1rem;margin:4px 0 18px;white-space:pre-line">${App.esc(msg)}</p><div class="row"><button class="btn" id="cf-no">No</button><button class="btn bg-verde" id="cf-yes">Sì</button></div>`,
          onMount(b) { b.querySelector('#cf-yes').onclick = () => done(true); b.querySelector('#cf-no').onclick = () => done(false); },
        });
        App._confirmPending = resolve;
      });
    },

    // Foglio "Scegli la famiglia": ricerca, elenco attive (meno quelle escluse), nuova famiglia al volo
    pickGuest({ allowAll, exclude, onPick }) {
      const ex = new Set(exclude || []);
      const draw = (q) => {
        const n = L.normalizeName(q);
        const list = store.state.guests.filter(g => !g.archived && !ex.has(g.id) && (!n || L.normalizeName(g.name).includes(n))).sort((a, b) => a.name.localeCompare(b.name));
        return (allowAll ? `<button class="item" data-pick=""><span class="ico bg-grigio">👥</span><div class="grow"><div class="name">Tutti gli ospiti</div></div></button>` : '') +
          (list.length
            ? list.map(g => `<button class="item" data-pick="${g.id}">${App.iconBox(L.initial(g.name), L.colorForName(g.name))}<div class="grow"><div class="name">${App.esc(g.name)}</div><div class="meta">di solito ${App.plural(g.defaultPeople, 'persona', 'persone')}</div></div></button>`).join('')
            : `<div class="empty">Nessun ospite trovato</div>`);
      };
      App.sheet({
        title: 'Scegli l\'ospite',
        html: `<input type="search" id="pg-q" placeholder="Cerca…" autocomplete="off"><button class="btn btn-block bg-verde mt" id="pg-new">＋ Nuovo ospite</button><div class="list mt" id="pg-list">${draw('')}</div>`,
        onMount(body) {
          const q = body.querySelector('#pg-q'), list = body.querySelector('#pg-list');
          q.addEventListener('input', () => { list.innerHTML = draw(q.value); });
          list.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (!b) return; App.closeSheet(); onPick(b.dataset.pick || null); });
          body.querySelector('#pg-new').addEventListener('click', () => App.editGuestSheet(null, g => onPick(g.id), q.value));
        },
      });
    },

    // Foglio nuova/modifica famiglia
    editGuestSheet(guest, done, presetName) {
      const isNew = !guest;
      App.sheet({
        title: isNew ? 'Nuovo ospite' : 'Modifica ospite',
        html: `<div class="field"><label>Nome (es. Rossi, o Famiglia Rossi)</label><input type="text" id="eg-name" value="${App.esc(guest ? guest.name : (presetName || ''))}" autocomplete="off"></div>
               <div class="field"><label>Persone di solito</label><div class="counter"><button class="btn btn-big" id="eg-minus">−</button><span class="num" id="eg-num">${guest ? guest.defaultPeople : 2}</span><button class="btn btn-big" id="eg-plus">＋</button></div></div>
               <div class="muted" id="eg-err"></div>
               <button class="btn btn-block bg-verde mt" id="eg-save">Salva</button>`,
        onMount(body) {
          let n = guest ? guest.defaultPeople : 2; const num = body.querySelector('#eg-num');
          body.querySelector('#eg-minus').onclick = () => { n = Math.max(1, n - 1); num.textContent = n; };
          body.querySelector('#eg-plus').onclick = () => { n = Math.min(L.PEOPLE_MAX, n + 1); num.textContent = n; };
          const nameInput = body.querySelector('#eg-name'); nameInput.focus();
          const save = () => {
            const name = nameInput.value.trim(); const err = body.querySelector('#eg-err');
            if (!name) { err.textContent = 'Scrivi un nome'; return; }
            if (L.nameExists(store.state.guests, name, guest && guest.id)) { err.textContent = 'Esiste già un ospite con questo nome'; return; }
            let g = guest;
            if (isNew) { g = { id: L.newId(), name, defaultPeople: n, createdAt: Date.now(), archived: false }; store.state.guests.push(g); }
            else { g.name = name; g.defaultPeople = n; }
            App.save(); App.closeSheet(); App.toast(isNew ? 'Ospite creato ✓' : 'Salvato ✓'); if (done) done(g);
          };
          body.querySelector('#eg-save').onclick = save;
          nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
        },
      });
    },
  };
  return App;
})();

</script>
<script>
// Tab "Tavolo": il tavolo di un giorno e pasto. Si aggiungono gli ospiti, si sceglie il menu, si preme Salva.
(function () {
  const A = window.App, L = A.L;
  A.screens.tavolo = { render(root) {
    const u = A.ui, today = L.todayISO(), svc = A.currentService(), dirty = A.formDirty();
    const dishes = A.state.dishes.filter(d => !d.hidden || d.id === u.dishId).sort((a, b) => a.order - b.order);
    const total = L.entryPeople({ guests: u.guests });
    const canSave = u.guests.length > 0 && dirty;
    // Cambio giorno o pasto: se c'è una bozza non salvata, chiedo se salvarla
    const changeDay = async (date, meal) => {
      if (A.formDirty()) {
        if (await A.confirm('Hai modifiche non salvate a questo tavolo. Vuoi salvarle?')) {
          const errs = A.saveForm(); if (errs.length) { A.toast(errs[0]); A.render(); return; }
          A.toast('Tavolo salvato ✓');
        }
      }
      u.date = date; u.meal = meal; u.returnTo = null; A.loadForm(); A.render();
    };
    root.innerHTML = `
      ${A.header('La Fiorita 2.0', L.formatDateIt(u.date), true)}
      ${A.backupWarning ? A.backupWarning() : ''}
      ${u.date > today ? '<div class="banner banner-giallo">📅 Stai segnando una data futura</div>' : ''}
      <div class="cols"><div>
      <div class="row"><input type="date" id="tv-date" value="${u.date}"><button class="chip fix ${u.date === today ? 'on' : ''}" id="tv-today">Oggi</button><button class="chip fix ${u.date === L.addDays(today, -1) ? 'on' : ''}" id="tv-yday">Ieri</button></div>
      <div class="seg mt"><button id="tv-pranzo" class="${u.meal === 'pranzo' ? 'on' : ''}">☀️ Pranzo</button><button id="tv-cena" class="${u.meal === 'cena' ? 'on' : ''}">🌙 Cena</button></div>
      <h3>Ospiti al tavolo</h3>
      <div class="list" id="tv-fams">${u.guests.map((g, i) => `<div class="fam"><div class="fam-top">${A.iconBox(L.initial(A.guestName(g.guestId)), L.colorForName(A.guestName(g.guestId)), 'sm')}<span class="name">${A.esc(A.guestName(g.guestId))}</span></div><div class="fam-ctl"><button class="btn btn-sq" data-minus="${i}" aria-label="Meno">−</button><span class="num">${g.people}</span><button class="btn btn-sq" data-plus="${i}" aria-label="Più">＋</button><span class="lbl">persone</span><button class="btn btn-sq danger rm" data-rm="${i}" aria-label="Togli dal tavolo">✕</button></div></div>`).join('')}
        ${u.guests.length ? '' : '<div class="empty" style="padding:10px">Nessun ospite. Tocca il tasto qui sotto.</div>'}</div>
      <button class="btn btn-block bg-viola mt" id="tv-add">＋ Aggiungi ospite</button>
      ${u.guests.length ? `<div class="tot mt"><span>${A.plural(u.guests.length, 'ospite', 'ospiti')}</span><span><span class="big">${total}</span> persone</span></div>` : ''}
      </div><div>
      <h3>Menu</h3>
      <div class="grid2" id="tv-dishes">${dishes.map(d => `<button class="dish ${u.dishId === d.id ? 'on bg-' + d.color : ''}" data-dish="${d.id}">${A.iconBox(d.emoji, d.color)}<span>${A.esc(d.name)}</span></button>`).join('')}</div>
      <div class="mt"><button class="btn btn-block bg-verde" id="tv-save" ${canSave ? '' : 'disabled'}>${svc && !dirty ? '✓ Tavolo salvato' : '✅ Salva tavolo'}</button></div>
      ${(svc || dirty) ? `<div class="row mt">${svc ? '<button class="btn danger" id="tv-del">🗑️ Elimina tavolo</button>' : ''}${dirty ? '<button class="btn" id="tv-cancel">Annulla</button>' : ''}</div>` : ''}
      </div></div>`;
    const q = s => root.querySelector(s);
    q('#tv-date').onchange = e => { if (L.isValidISO(e.target.value)) changeDay(e.target.value, u.meal); };
    q('#tv-today').onclick = () => changeDay(today, u.meal);
    q('#tv-yday').onclick = () => changeDay(L.addDays(today, -1), u.meal);
    q('#tv-pranzo').onclick = () => changeDay(u.date, 'pranzo');
    q('#tv-cena').onclick = () => changeDay(u.date, 'cena');
    q('#tv-dishes').onclick = e => { const b = e.target.closest('[data-dish]'); if (!b) return; u.dishId = u.dishId === b.dataset.dish ? null : b.dataset.dish; A.render(); };
    q('#tv-fams').onclick = e => {
      const m = e.target.closest('[data-minus]'), p = e.target.closest('[data-plus]'), r = e.target.closest('[data-rm]');
      if (m) u.guests[+m.dataset.minus].people = Math.max(1, u.guests[+m.dataset.minus].people - 1);
      else if (p) u.guests[+p.dataset.plus].people = Math.min(L.PEOPLE_MAX, u.guests[+p.dataset.plus].people + 1);
      else if (r) u.guests.splice(+r.dataset.rm, 1);
      else return;
      A.render();
    };
    q('#tv-add').onclick = () => A.pickGuest({ exclude: u.guests.map(g => g.guestId), onPick(id) {
      const g = A.state.guests.find(x => x.id === id); if (!g || u.guests.some(x => x.guestId === id)) return;
      u.guests.push({ guestId: id, people: g.defaultPeople }); A.render();
    } });
    q('#tv-save').onclick = () => {
      const btn = q('#tv-save'); btn.disabled = true;
      const existed = !!A.currentService();
      const errs = A.saveForm(); if (errs.length) { btn.disabled = false; A.toast(errs[0]); return; }
      A.afterForm(); A.render(); A.toast(existed ? 'Modifiche salvate ✓' : 'Tavolo salvato ✓');
    };
    if (q('#tv-cancel')) q('#tv-cancel').onclick = () => { A.afterForm(); A.render(); };
    if (q('#tv-del')) q('#tv-del').onclick = async () => {
      if (!await A.confirm(`Eliminare il tavolo di ${A.mealLabel(u.meal)} del ${L.formatDateIt(u.date)}?`)) return;
      A.state.entries = A.state.entries.filter(x => x !== svc); A.afterForm(); A.save(); A.toast('Eliminato');
    };
  } };
})();

</script>
<script>
// Tab "Storico": tutte le righe per giorno, con pranzo e cena, famiglie e menu
(function () {
  const A = window.App, L = A.L;
  // Riga di un servizio (usata anche dai Conti): menu, pasto, persone, elenco famiglie
  A.serviceRow = function (e) {
    const d = A.dish(e.dishId), p = L.entryPeople(e);
    return `<button class="svc" data-svc="${e.date}|${e.meal}">
      <div class="top">${A.iconBox(d.emoji, d.color, 'sm')}<div class="grow"><div class="name">${A.mealLabel(e.meal)} · ${A.esc(d.name)}</div></div><span class="n">${p}</span><span class="muted">👤</span></div>
      <div class="fams">${e.guests.map(g => `<b>${A.esc(A.guestName(g.guestId))}</b> ${g.people}`).join(' · ')}</div></button>`;
  };
  A.bindServiceRows = function (root) {
    root.onclick = e => { const b = e.target.closest('[data-svc]'); if (b) { const [date, meal] = b.dataset.svc.split('|'); A.openService(date, meal); } };
  };
  A.screens.storico = { render(root) {
    const days = L.groupByDay(A.state.entries);
    const shown = days.slice(0, A.ui.storicoLimit);
    root.innerHTML = `${A.header('Storico', A.plural(A.state.entries.length, 'pasto segnato', 'pasti segnati'))}
      ${days.length ? '<div class="storico-grid">' + shown.map(day => { const p = day.entries.reduce((s, e) => s + L.entryPeople(e), 0);
        return `<div class="day"><h3>${L.formatDateIt(day.date)} <span class="muted" style="text-transform:none;letter-spacing:0">· ${p} persone</span></h3><div class="list">${day.entries.map(A.serviceRow).join('')}</div></div>`; }).join('') + '</div>'
        : `<div class="empty"><div class="big">📅</div>Ancora nessun tavolo. Segnalo dalla tab Tavolo.</div>`}
      ${days.length > shown.length ? `<div class="center mt"><button class="chip" id="st-more">Mostra altri giorni (${days.length - shown.length})</button></div>` : ''}`;
    A.bindServiceRows(root);
    if (root.querySelector('#st-more')) root.querySelector('#st-more').onclick = () => { A.ui.storicoLimit += 30; A.render(); };
  } };
})();

</script>
<script>
// Tab "Ospiti": schede, dettaglio, archivio
(function () {
  const A = window.App, L = A.L;
  const COL = { rosa: '#F2547D', verde: '#7BC043', giallo: '#F5C842', viola: '#6C4BE0', azzurro: '#4FB3E8', arancio: '#F58A3C', grigio: '#B8B8B8' };
  function detail(g) {
    const st = L.guestStats(A.state.entries)[g.id] || { tables: 0, people: 0 };
    const last = L.sortEntries(A.state.entries.filter(e => e.guests.some(x => x.guestId === g.id))).slice(0, 5);
    const used = !L.canDeleteGuest(g.id, A.state.entries);
    A.sheet({ title: g.name, html: `
      <div class="grid2"><div class="stat"><div class="lbl">Volte</div><div class="val">${st.tables}</div></div><div class="stat"><div class="lbl">Persone</div><div class="val">${st.people}</div></div></div>
      <div class="row mt"><button class="btn" id="gd-edit">✏️ Modifica</button>${used ? `<button class="btn" id="gd-arch">${g.archived ? '↩️ Ripristina' : '📦 Archivia'}</button>` : ''}<button class="btn danger" id="gd-del">🗑️ Elimina</button></div>
      ${used ? '<p class="muted">Ha pasti già segnati: se lo elimini, in quei pasti comparirà "Ospite eliminato". Archiviare lo toglie solo dall\'elenco.</p>' : ''}
      ${last.length ? '<h3>Ultime visite</h3><div class="list">' + last.map(e => { const d = A.dish(e.dishId); const row = e.guests.find(x => x.guestId === g.id); return `<div class="item" style="cursor:default">${A.iconBox(d.emoji, d.color, 'sm')}<div class="grow"><div class="name">${L.formatDateIt(e.date)}</div><div class="meta">${A.mealLabel(e.meal)} · ${A.esc(d.name)}</div></div><span class="n">${row ? row.people : 0}</span></div>`; }).join('') + '</div>' : ''}`,
      onMount(b) {
        b.querySelector('#gd-edit').onclick = () => A.editGuestSheet(g, () => A.render());
        b.querySelector('#gd-del').onclick = async () => {
          const msg = used ? `Eliminare "${g.name}"?\nNei pasti già segnati resterà la scritta "Ospite eliminato".` : `Eliminare "${g.name}"?`;
          if (await A.confirm(msg)) { A.state.guests = A.state.guests.filter(x => x.id !== g.id); A.closeSheet(); A.save(); A.toast('Eliminato'); }
        };
        const arch = b.querySelector('#gd-arch'); if (arch) arch.onclick = () => { g.archived = !g.archived; A.closeSheet(); A.save(); A.toast(g.archived ? 'Archiviato' : 'Ripristinato'); };
      } });
  }
  A.screens.gruppi = { render(root) {
    const stats = L.guestStats(A.state.entries);
    const list = A.state.guests.filter(g => A.ui.showArchived ? g.archived : !g.archived).sort((a, b) => a.name.localeCompare(b.name));
    const active = A.state.guests.filter(g => !g.archived).length;
    root.innerHTML = `<div class="head"><div><h1>Ospiti</h1><p class="sub">${A.plural(active, 'ospite attivo', 'ospiti attivi')}</p></div><div class="row" style="flex:0 0 auto"><button class="btn btn-sq bg-giallo fix" id="gr-new" aria-label="Nuovo ospite">＋</button><button class="btn btn-sq fix" data-go="impostazioni" aria-label="Altro">⚙️</button></div></div>
      ${list.length ? `<div class="grid2">${list.map(g => { const s = stats[g.id] || { tables: 0, people: 0 }; const c = L.colorForName(g.name); return `<button class="folder" style="--tab:${COL[c]}" data-g="${g.id}">${A.iconBox(L.initial(g.name), c)}<div class="name">${A.esc(g.name)}</div><div class="meta">${A.plural(s.tables, 'volta', 'volte')} · ${s.people} persone</div></button>`; }).join('')}</div>`
                   : `<div class="empty"><div class="big">👨‍👩‍👧</div>${A.ui.showArchived ? 'Nessun ospite archiviato' : 'Ancora nessun ospite. Tocca ＋ per crearne uno.'}</div>`}
      <div class="center" style="margin-top:24px"><button class="chip ${A.ui.showArchived ? 'on' : ''}" id="gr-arch">${A.ui.showArchived ? 'Mostra attivi' : 'Mostra archiviati'}</button></div>`;
    root.querySelector('#gr-new').onclick = () => A.editGuestSheet(null, () => A.render());
    root.querySelector('#gr-arch').onclick = () => { A.ui.showArchived = !A.ui.showArchived; A.render(); };
    root.onclick = e => { const b = e.target.closest('[data-g]'); if (b) detail(A.state.guests.find(x => x.id === b.dataset.g)); };
  } };
})();

</script>
<script>
// Tab "Menu": elenco, ordine, nuovo/modifica, nascondi/elimina
(function () {
  const A = window.App, L = A.L;
  function editSheet(dish) {
    const isNew = !dish; let emoji = dish ? dish.emoji : '🍽️', color = dish ? dish.color : 'rosa';
    A.sheet({ title: isNew ? 'Nuovo menu' : 'Modifica menu', html: `
      <div class="field"><label>Nome</label><input type="text" id="ed-name" value="${A.esc(dish ? dish.name : '')}" autocomplete="off"></div>
      <div class="field"><label>Icona</label><div class="emoji-grid" id="ed-emoji">${L.EMOJI_CIBO.map(e => `<button data-e="${e}" class="${e === emoji ? 'on' : ''}">${e}</button>`).join('')}</div></div>
      <div class="field"><label>Colore</label><div class="color-row" id="ed-color">${L.COLORS.map(c => `<button data-c="${c}" class="bg-${c} ${c === color ? 'on' : ''}" aria-label="${c}"></button>`).join('')}</div></div>
      <div class="muted" id="ed-err"></div><button class="btn btn-block bg-verde mt" id="ed-save">Salva</button>`,
      onMount(b) {
        b.querySelector('#ed-emoji').onclick = e => { const x = e.target.closest('[data-e]'); if (!x) return; emoji = x.dataset.e; b.querySelectorAll('#ed-emoji button').forEach(y => y.classList.toggle('on', y === x)); };
        b.querySelector('#ed-color').onclick = e => { const x = e.target.closest('[data-c]'); if (!x) return; color = x.dataset.c; b.querySelectorAll('#ed-color button').forEach(y => y.classList.toggle('on', y === x)); };
        b.querySelector('#ed-save').onclick = () => {
          const name = b.querySelector('#ed-name').value.trim(), err = b.querySelector('#ed-err');
          if (!name) { err.textContent = 'Scrivi un nome'; return; }
          if (L.nameExists(A.state.dishes, name, dish && dish.id)) { err.textContent = 'Esiste già un menu con questo nome'; return; }
          if (isNew) A.state.dishes.push({ id: L.newId(), name, emoji, color, hidden: false, order: A.state.dishes.length });
          else Object.assign(dish, { name, emoji, color });
          A.closeSheet(); A.save(); A.toast('Salvato ✓');
        };
      } });
  }
  function actionSheet(d) {
    const used = !L.canDeleteDish(d.id, A.state.entries);
    A.sheet({ title: d.name, html: `<div class="list"><button class="btn btn-block" id="pd-edit">✏️ Modifica nome, icona, colore</button>
      ${used ? `<button class="btn btn-block" id="pd-hide">${d.hidden ? '👁️ Mostra di nuovo' : '🙈 Nascondi dai bottoni'}</button>` : ''}
      <button class="btn btn-block danger" id="pd-del">🗑️ Elimina</button>
      ${used ? '<p class="muted">È usato in pasti già segnati: se lo elimini, in quei pasti comparirà "Menu eliminato". Nascondere lo toglie solo dai bottoni.</p>' : ''}</div>`,
      onMount(b) {
        b.querySelector('#pd-edit').onclick = () => editSheet(d);
        b.querySelector('#pd-del').onclick = async () => {
          const msg = used ? `Eliminare "${d.name}"?\nNei pasti già segnati resterà la scritta "Menu eliminato".` : `Eliminare "${d.name}"?`;
          if (await A.confirm(msg)) { A.state.dishes = A.state.dishes.filter(x => x.id !== d.id); A.closeSheet(); A.save(); A.toast('Eliminato'); }
        };
        const hide = b.querySelector('#pd-hide'); if (hide) hide.onclick = () => { d.hidden = !d.hidden; A.closeSheet(); A.save(); A.toast(d.hidden ? 'Nascosto' : 'Visibile'); };
      } });
  }
  A.screens.portate = { render(root) {
    const dishes = A.state.dishes.slice().sort((a, b) => a.order - b.order);
    const use = {}; A.state.entries.forEach(e => { use[e.dishId] = (use[e.dishId] || 0) + 1; });
    root.innerHTML = `<div class="head"><div><h1>Menu</h1><p class="sub">I bottoni che compaiono in Tavolo</p></div><div class="row" style="flex:0 0 auto"><button class="btn btn-sq bg-giallo fix" id="pt-new" aria-label="Nuovo menu">＋</button><button class="btn btn-sq fix" data-go="impostazioni" aria-label="Altro">⚙️</button></div></div>
      <div class="list">${dishes.map((d, i) => `<div class="item" style="cursor:default">${A.iconBox(d.emoji, d.color)}<div class="grow"><div class="name">${A.esc(d.name)}${d.hidden ? ' <span class="muted">(nascosto)</span>' : ''}</div><div class="meta">${use[d.id] || 0} pasti</div></div>
        <button class="btn btn-sq" data-up="${d.id}" ${i === 0 ? 'disabled' : ''} aria-label="Sposta su">▲</button><button class="btn btn-sq" data-down="${d.id}" ${i === dishes.length - 1 ? 'disabled' : ''} aria-label="Sposta giù">▼</button><button class="btn btn-sq" data-edit="${d.id}" aria-label="Modifica">✏️</button></div>`).join('')}</div>`;
    root.querySelector('#pt-new').onclick = () => editSheet(null);
    root.onclick = e => {
      const up = e.target.closest('[data-up]'), down = e.target.closest('[data-down]'), ed = e.target.closest('[data-edit]');
      if (up || down) {
        const id = up ? up.dataset.up : down.dataset.down; const i = dishes.findIndex(d => d.id === id); const j = up ? i - 1 : i + 1;
        if (i < 0 || j < 0 || j >= dishes.length) return;
        dishes.forEach((d, k) => { d.order = k; }); // normalizza prima di scambiare
        [dishes[i].order, dishes[j].order] = [dishes[j].order, dishes[i].order]; A.save(); return;
      }
      if (ed) actionSheet(A.state.dishes.find(x => x.id === ed.dataset.edit));
    };
  } };
})();

</script>
<script>
// Tab "Conti": periodo, filtri, totali, per portata, per gruppo, elenco
(function () {
  const A = window.App, L = A.L;
  function range(r) {
    if (r.mode === 'mese') return L.monthRange(r.year, r.month);
    if (r.mode === 'anno') return L.yearRange(r.year);
    const m = L.monthRange(r.year, r.month);
    return { from: r.from || m.from, to: r.to || m.to };
  }
  function shiftMonth(r, d) { let m = r.month + d, y = r.year; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } r.month = m; r.year = y; }
  A.screens.rendiconto = { render(root) {
    const r = A.ui.report, { from, to } = range(r);
    const entries = L.filterEntries(A.state.entries, { from, to, guestId: r.guestId, meal: r.meal });
    const s = L.summarize(entries, A.state, { guestId: r.guestId });
    const gname = r.guestId ? A.guestName(r.guestId) : 'Tutti gli ospiti';
    const maxDish = Math.max(1, ...s.byDish.map(d => d.people));
    const guests = r.showAllGuests ? s.byGuest : s.byGuest.slice(0, 10);
    const nav = label => `<div class="row"><button class="btn btn-sq fix" id="rp-prev" aria-label="Precedente">◀</button><div class="center" style="font-weight:700;font-size:20px">${label}</div><button class="btn btn-sq fix" id="rp-next" aria-label="Successivo">▶</button></div>`;
    const periodo = r.mode === 'mese' ? nav(L.monthLabelIt(r.year, r.month))
      : r.mode === 'anno' ? nav(String(r.year))
      : `<div class="row"><input type="date" id="rp-from" value="${from}"><span class="fix">→</span><input type="date" id="rp-to" value="${to}"></div>
         <div class="row mt" style="flex-wrap:wrap"><button class="chip fix" data-q="1">1–15</button><button class="chip fix" data-q="2">16–fine</button><button class="chip fix" data-q="m">Questo mese</button></div>`;
    root.innerHTML = `${A.header('Conti', L.formatDateIt(from) + ' → ' + L.formatDateIt(to))}
      <div class="cols"><div>
      <div class="seg mb"><button data-mode="mese" class="${r.mode === 'mese' ? 'on' : ''}">Mese</button><button data-mode="anno" class="${r.mode === 'anno' ? 'on' : ''}">Anno</button><button data-mode="da-a" class="${r.mode === 'da-a' ? 'on' : ''}">Da – A</button></div>
      ${periodo}
      <div class="row mt"><button class="btn ${r.guestId ? 'bg-viola' : ''}" id="rp-guest">👥 ${A.esc(gname)}</button></div>
      <div class="seg mt"><button data-meal="" class="${!r.meal ? 'on' : ''}">Tutti</button><button data-meal="pranzo" class="${r.meal === 'pranzo' ? 'on' : ''}">☀️ Pranzo</button><button data-meal="cena" class="${r.meal === 'cena' ? 'on' : ''}">🌙 Cena</button></div>
      ${s.tables === 0 ? `<div class="empty"><div class="big">🗓️</div>Nessun tavolo in questo periodo</div>` : `
      <div class="grid2 mt"><div class="stat bg-giallo"><div class="lbl">Pasti</div><div class="val">${s.tables}</div></div><div class="stat bg-rosa"><div class="lbl">Persone</div><div class="val">${s.people}</div></div></div>
      <h3>Pranzo e cena</h3><div class="grid2"><div class="stat"><div class="lbl">☀️ Pranzo</div><div class="val">${s.byMeal.pranzo.people}</div><div class="muted">${s.byMeal.pranzo.tables} pasti</div></div><div class="stat"><div class="lbl">🌙 Cena</div><div class="val">${s.byMeal.cena.people}</div><div class="muted">${s.byMeal.cena.tables} pasti</div></div></div>
      </div><div>
      <h3>Per menu</h3><div class="list">${s.byDish.map(d => `<div class="item" style="cursor:default;flex-wrap:wrap">${A.iconBox(d.emoji, d.color, 'sm')}<div class="grow"><div class="name">${A.esc(d.name)}${d.hidden ? ' <span class="muted">(nascosto)</span>' : ''}</div><div class="meta">${d.tables} pasti</div></div><span class="n">${d.people}</span><span class="muted">👤</span><div class="bar" style="flex-basis:100%"><i class="bg-${d.color}" style="width:${Math.round(d.people / maxDish * 100)}%"></i></div></div>`).join('')}</div>
      ${r.guestId ? '' : `<h3>Per ospite</h3><div class="list">${guests.map((g, i) => `<div class="item" style="cursor:default">${A.iconBox(i + 1, i === 0 ? 'giallo' : 'grigio', 'sm')}<div class="grow"><div class="name">${A.esc(g.name)}${g.archived ? ' <span class="muted">(archiviato)</span>' : ''}</div><div class="meta">${A.plural(g.tables, 'volta', 'volte')}</div></div><span class="n">${g.people}</span><span class="muted">👤</span></div>`).join('')}</div>
        ${s.byGuest.length > 10 && !r.showAllGuests ? `<div class="center mt"><button class="chip" id="rp-all">Mostra tutti (${s.byGuest.length})</button></div>` : ''}`}
`}
      </div></div>`;
    const q = s => root.querySelector(s);
    root.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { r.mode = b.dataset.mode; if (r.mode === 'da-a' && !r.from) { const m = L.monthRange(r.year, r.month); r.from = m.from; r.to = m.to; } A.render(); });
    root.querySelectorAll('[data-meal]').forEach(b => b.onclick = () => { r.meal = b.dataset.meal || null; A.render(); });
    if (q('#rp-prev')) { q('#rp-prev').onclick = () => { if (r.mode === 'anno') r.year--; else shiftMonth(r, -1); A.render(); }; q('#rp-next').onclick = () => { if (r.mode === 'anno') r.year++; else shiftMonth(r, 1); A.render(); }; }
    if (q('#rp-from')) {
      q('#rp-from').onchange = e => { if (L.isValidISO(e.target.value)) { r.from = e.target.value; if (r.to < r.from) r.to = r.from; A.render(); } };
      q('#rp-to').onchange = e => { if (L.isValidISO(e.target.value)) { r.to = e.target.value; if (r.to < r.from) r.from = r.to; A.render(); } };
      root.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const k = b.dataset.q; const rr = k === 'm' ? L.monthRange(r.year, r.month) : L.fortnightRange(r.year, r.month, Number(k)); r.from = rr.from; r.to = rr.to; A.render(); });
    }
    q('#rp-guest').onclick = () => A.pickGuest({ allowAll: true, onPick(id) { r.guestId = id; A.render(); } });
    if (q('#rp-all')) q('#rp-all').onclick = () => { r.showAllGuests = true; A.render(); };
  } };
})();

</script>
<script>
// Tab "Altro": backup, ripristino, info, istruzioni Home, cancella tutto
(function () {
  const A = window.App, L = A.L;
  const APP_VERSION = '2.0.0';
  A.backupWarning = function () {
    const st = A.state; if (st.entries.length < 10) return '';
    const days = st.lastBackupAt ? Math.floor((Date.now() - st.lastBackupAt) / 86400000) : null;
    if (days !== null && days < 30) return '';
    return `<div class="banner banner-giallo">💾 ${days === null ? 'Non hai mai salvato una copia dei dati.' : `Ultima copia ${days} giorni fa.`} <a href="#" data-go="impostazioni">Salva ora</a></div>`;
  };
  // Tre strade per "Salva copia", e il backup conta solo se va a buon fine:
  // 1) dentro claude.ai i download avviati dalla pagina sono bloccati → capacità "downloads";
  // 2) su iPhone (anche in Home) → foglio di condivisione con "Salva su File";
  // 3) altrove → download classico.
  async function download() {
    const text = L.serializeBackup(A.state);
    const filename = `lafiorita-backup-${L.todayISO()}.json`;
    let dl = null;
    try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (_) { dl = null; }
    if (dl) {
      try { await dl.save({ filename, data: text }); }
      catch (err) { if (!err || err.code !== 'declined') A.toast('❌ Salvataggio non riuscito'); return; }
    } else {
      const file = new File([text], filename, { type: 'application/json' });
      if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'La Fiorita - copia dei dati' }); }
        catch (err) { if (!err || err.name !== 'AbortError') A.toast('❌ Condivisione non riuscita'); return; }
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename;
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      }
    }
    A.state.lastBackupAt = Date.now(); A.save(); A.toast('Copia salvata ✓');
  }
  function restore(file) {
    const rd = new FileReader();
    rd.onload = async () => {
      const r = L.parseBackup(String(rd.result));
      if (!r.ok) { A.toast('❌ ' + r.error); return; }
      const ok = await A.confirm(`Sostituire tutti i dati attuali con la copia?\n${r.state.entries.length} pasti, ${r.state.guests.length} ospiti${r.skipped ? `\n(${r.skipped} righe non valide scartate)` : ''}`);
      if (!ok) return;
      A.store.replace(r.state); A.ui.returnTo = null; A.ui.report.guestId = null; A.loadForm(); A.render(); A.toast('Ripristinato ✓');
    };
    rd.readAsText(file);
  }
  A.screens.impostazioni = { render(root) {
    const st = A.state; const last = st.lastBackupAt ? new Date(st.lastBackupAt).toLocaleDateString('it-IT') : 'mai';
    root.innerHTML = `<div class="head"><div><h1>Altro</h1><p class="sub">Copie di sicurezza e impostazioni</p></div><button class="btn btn-sq" data-go="tavolo" aria-label="Torna al tavolo">✕</button></div>
      ${A.backupWarning()}
      <div class="card"><h2>💾 Copia dei dati</h2><p class="muted">Ultima copia: <b>${last}</b>. Il file finisce in "File" sull'iPhone: tienilo su iCloud.</p>
        <button class="btn btn-block bg-verde mt" id="st-backup">Salva copia</button>
        <label class="btn btn-block mt" for="st-file">Ripristina da copia…</label><input type="file" id="st-file" accept=".json,application/json" hidden></div>
      <div class="card mt"><h2>📋 Dati</h2><p class="muted">${st.entries.length} pasti · ${st.guests.length} ospiti · ${st.dishes.length} menu<br>La Fiorita ${APP_VERSION}</p></div>
      <div class="card mt"><h2>📱 Mettila in Home</h2><ol class="muted" style="padding-left:20px;margin:8px 0 0"><li>Apri questa pagina in <b>Safari</b></li><li>Tocca il tasto <b>Condividi</b> (quadrato con la freccia)</li><li>Scegli <b>"Aggiungi alla schermata Home"</b></li></ol></div>
      <div class="card mt" style="border-color:#b00020"><h2 class="danger">⚠️ Zona pericolosa</h2><button class="btn btn-block danger mt" id="st-wipe">Cancella tutto</button></div>`;
    root.querySelector('#st-backup').onclick = download;
    root.querySelector('#st-file').onchange = e => { const f = e.target.files[0]; if (f) restore(f); e.target.value = ''; };
    root.querySelector('#st-wipe').onclick = async () => {
      if (!await A.confirm('Cancellare TUTTI i dati? Non si può annullare.')) return;
      if (!await A.confirm('Sei sicuro? Ospiti, menu e pasti spariranno.')) return;
      A.store.replace(L.emptyState()); A.ui.returnTo = null; A.ui.report.guestId = null; A.loadForm(); A.render(); A.toast('Tutto cancellato');
    };
  } };
})();

</script>
<script>App.start();</script>
